name: 问题反馈
description: 报告页面、图片浏览、收藏、下载或离线使用中的问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 Issue。
        安全漏洞请使用[私密报告入口](https://github.com/oonecab/daily-picture-web/security/advisories/new)。请勿公开凭据、个人数据或漏洞利用细节。
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 填写设备型号、系统版本、浏览器名称和版本，以及网站地址或本地版本/提交；不确定的项目可注明。
      placeholder: "例如：iPhone / iOS 版本 / Safari 版本；公开网站或本地运行；是否从主屏幕打开。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，说明每一步操作。手机布局问题请注明横竖屏、地址栏状态和缩放设置。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你希望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？是否每次出现，刷新或更换浏览器后是否仍然出现？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或补充信息
      description: 界面问题尽量附图；提供报错时先隐藏令牌、个人信息和私密地址。无需上传完整收藏或缓存。
