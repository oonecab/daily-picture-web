name: Collect Bing wallpapers
on:
  schedule:
    - cron: '17 21 * * *' # 05:17 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-wallpapers.yml'
      - 'tools/collect-index.mjs'
      - 'lib/bing.mjs'
      - 'lib/markets.mjs'
      - 'lib/owned-index.mjs'
permissions:
  contents: write
concurrency:
  group: wallpaper-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Open the owned data branch
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/wallpaper-data
          destination="$RUNNER_TEMP/wallpaper-data"
          remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote_ref" ]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git worktree add --detach "$destination" "refs/remotes/origin/$branch"
          else
            git worktree add --detach "$destination" HEAD
            git -C "$destination" checkout --orphan "$branch"
            git -C "$destination" rm -rf .
          fi
      - name: Collect the latest fifteen days for six regions
        id: collect
        continue-on-error: true
        run: node tools/collect-index.mjs --market all --output "$RUNNER_TEMP/wallpaper-data"
      - name: Save the daily index
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wallpaper-data"
          git config user.name oonecab
          git config user.email hisaohisaochao@foxmail.com
          git add -- '*.json'
          if ! git diff --cached --quiet; then
            git commit -m "data: collect six-region Bing daily indexes"
            git push origin HEAD:refs/heads/codex/wallpaper-data
          fi
      - name: Report a partial collection failure after saving successful regions
        if: steps.collect.outcome == 'failure'
        run: exit 1
