name: 改进建议
description: 提出希望改善的使用场景或功能。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有建议，尽量描述实际使用中的需求。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
      description: 希望如何操作、看到什么结果？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 可以提供其他解决方法、草图或参考链接，请隐藏个人信息。
